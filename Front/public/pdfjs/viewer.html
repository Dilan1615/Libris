<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Visor PDF</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; background: #0f172a; color: #e5e7eb; font-family: "Inter", system-ui, sans-serif; }
    #pdfFrame { width: 100%; height: 100%; border: none; background: #0b1224; }
    .overlay {
      position: absolute; inset: 0; display: grid; place-items: center;
      background: linear-gradient(135deg,#0f172a 0%,#111827 50%,#0f172a 100%);
      color: #e5e7eb; text-align: center; gap: 12px; padding: 24px;
    }
    .spinner {
      width: 48px; height: 48px; border: 5px solid rgba(255,255,255,0.18);
      border-top-color: #3b82f6; border-radius: 50%; animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error { color: #fca5a5; font-weight: 700; }
  </style>
</head>
<body>
  <div id="loading" class="overlay">
    <div class="spinner"></div>
    <div>Cargando PDF…</div>
  </div>

  <div id="error" class="overlay error" hidden></div>

  <iframe id="pdfFrame" title="Visor PDF" hidden></iframe>

  <script>
    (() => {
      const params = new URLSearchParams(location.search);
      const fileUrl = params.get("file");
      const loading = document.getElementById("loading");
      const errorBox = document.getElementById("error");
      const frame = document.getElementById("pdfFrame");

      const showError = (msg) => {
        loading.hidden = true;
        errorBox.textContent = msg;
        errorBox.hidden = false;
        frame.hidden = true;
      };

      if (!fileUrl) {
        showError("No se especificó archivo PDF");
        return;
      }

      frame.onload = () => {
        loading.hidden = true;
        errorBox.hidden = true;
        frame.hidden = false;
      };

      frame.onerror = () => showError("No se pudo cargar el PDF");

      // Cargar
      frame.src = fileUrl;
    })();
  </script>
</body>
</html>
